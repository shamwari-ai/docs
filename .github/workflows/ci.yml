name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in
    # the stack, and a filter of [main] silently gives every layer but the
    # bottom one zero checks — the failure looks like a green PR, which is
    # the worst shape for it to take. Matches shamwari-ai/shamwari's ci.yml.
    branches: [main, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Strict mode: exits non-zero on any warning or error, not just a
      # hard build failure.
      - name: mint validate
        run: npx --yes mint@latest validate

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # --check-external is deliberately omitted: it makes the check
      # dependent on third-party site availability and turns transient
      # network failures into a red PR unrelated to the diff. Internal
      # links, anchors, and docs.json redirect destinations are within
      # this repo's control and cost nothing to check on every push.
      - name: mint broken-links
        run: npx --yes mint@latest broken-links --check-anchors --check-redirects

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Brand colours are gated by APCA 3.0, which is Mzizi's stated
      # standard, not by mint a11y's WCAG heuristic. That heuristic is not
      # polarity-aware: it tests colors.dark against BOTH backgrounds and
      # demands 3:1 on each, even though `dark` only ever renders in light
      # mode and `light` only ever renders in dark mode. Satisfying it
      # forces both values to mid-tone and serves neither theme.
      #
      # It also masks real failures. Sodalite's darkHex #3D5AFE scores
      # 3.78:1 on the dark background — a WCAG pass — but APCA Lc -26.9,
      # below even the Lc 30 non-text floor.
      - name: Brand colour contrast (APCA 3.0)
        run: node scripts/check-contrast.mjs

      # mint a11y still runs, for the checks it is genuinely good at: alt
      # attributes on every image and video across the MDX files. Its
      # colour section is advisory here for the reasons above, so the exit
      # code is not the gate — the MDX result is parsed explicitly instead,
      # and an unrecognised output shape fails rather than passing silently.
      - name: mint a11y (MDX alt attributes)
        run: |
          set -uo pipefail
          out=$(npx --yes mint@latest a11y 2>&1) || true
          echo "$out"
          if ! grep -qi 'Checking mdx files for accessibility issues' <<<"$out"; then
            echo "::error::mint a11y output did not contain the MDX section — output shape changed, refusing to pass silently."
            exit 1
          fi
          if ! grep -qiE 'no accessibility issues found' <<<"$out"; then
            echo "::error::mint a11y reported MDX accessibility issues (missing alt attributes)."
            exit 1
          fi
          echo "MDX accessibility checks passed."

  language-discipline:
    name: Language discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same rule shamwari-ai/shamwari's docs-site/site enforce via
      # check.mjs (see that repo's CLAUDE.md, "Language discipline" table):
      # never claim "open source model", "we built our own model", or that
      # data "stays in Africa" outside Mind/Ground. language.mdx and
      # language.mdx is excluded because it *quotes* these as the phrases
      # not to use — matching there is the point, not a violation. Add a
      # page here only if it is genuinely meta-documentation about the
      # rule, not product copy.
      - name: Check for banned phrasing
        run: |
          set -uo pipefail
          pattern='open[- ]source model|we built our own model|(your|our) data stays in africa'
          exclude='^\./language\.mdx:'
          hits=$(grep -rniE "$pattern" --include='*.mdx' . | grep -vE "$exclude" || true)
          if [ -n "$hits" ]; then
            echo "::error::Language-discipline violation(s) found — see the Language discipline table in shamwari-ai/shamwari's CLAUDE.md:"
            echo "$hits"
            exit 1
          fi
          echo "No language-discipline violations found."

  # Delegated to the org reusable so the gitleaks version and the
  # licence workaround are maintained in one place.
  secrets:
    uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main
