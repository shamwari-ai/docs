name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in
    # the stack, and a filter of [main] silently gives every layer but the
    # bottom one zero checks — the failure looks like a green PR, which is
    # the worst shape for it to take. Matches shamwari-ai/shamwari's ci.yml.
    branches: [main, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Strict mode: exits non-zero on any warning or error, not just a
      # hard build failure.
      - name: mint validate
        run: npx --yes mint@latest validate

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # --check-external is deliberately omitted: it makes the check
      # dependent on third-party site availability and turns transient
      # network failures into a red PR unrelated to the diff. Internal
      # links, anchors, and docs.json redirect destinations are within
      # this repo's control and cost nothing to check on every push.
      - name: mint broken-links
        run: npx --yes mint@latest broken-links --check-anchors --check-redirects

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: mint a11y
        run: npx --yes mint@latest a11y

  language-discipline:
    name: Language discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Same rule shamwari-ai/shamwari's docs-site/site enforce via
      # check.mjs (see that repo's CLAUDE.md, "Language discipline" table):
      # never claim "open source model", "we built our own model", or that
      # data "stays in Africa" outside Mind/Ground. language.mdx and
      # language.mdx is excluded because it *quotes* these as the phrases
      # not to use — matching there is the point, not a violation. Add a
      # page here only if it is genuinely meta-documentation about the
      # rule, not product copy.
      - name: Check for banned phrasing
        run: |
          set -uo pipefail
          pattern='open[- ]source model|we built our own model|(your|our) data stays in africa'
          exclude='^\./language\.mdx:'
          hits=$(grep -rniE "$pattern" --include='*.mdx' . | grep -vE "$exclude" || true)
          if [ -n "$hits" ]; then
            echo "::error::Language-discipline violation(s) found — see the Language discipline table in shamwari-ai/shamwari's CLAUDE.md:"
            echo "$hits"
            exit 1
          fi
          echo "No language-discipline violations found."

  # Delegated to the org reusable so the gitleaks version and the
  # licence workaround are maintained in one place.
  secrets:
    uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main
